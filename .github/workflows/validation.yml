# This is a basic workflow to help you get started with Actions

name: Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm install
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm install
      - run: npm run lint

  test-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Cache Angular
        uses: actions/cache@v5
        with:
          path: demo/angular/.angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('demo/angular/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-angular-${{ hashFiles('demo/angular/package-lock.json') }}-
            ${{ runner.os }}-angular-
      - run: npm install
      - run: npm run build
      - run: npm ci && npm run test:ci
        working-directory: demo/angular

  verify-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm install
      - run: npm run verify:web

  verify-android:
    runs-on: ubuntu-latest
    steps:
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm install
      - run: npm run verify:android

  verify-ios:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm run verify:ios
      - name: Run iOS unit tests
        run: npm run test:ios -- -destination 'platform=iOS Simulator,name=iPhone 16,OS=26.2' -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/ios-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
