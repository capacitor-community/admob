ext {
    junitVersion = rootProject.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = rootProject.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.8.0'
    androidxCoordinatorLayoutVersion = rootProject.hasProperty('androidxCoordinatorLayoutVersion') ? rootProject.ext.androidxCoordinatorLayoutVersion : '1.3.0'
    androidxJunitVersion = rootProject.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.3.0'
    androidxEspressoCoreVersion = rootProject.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.7.0'
    playServicesAdsVersion = rootProject.hasProperty('playServicesAdsVersion') ? rootProject.ext.playServicesAdsVersion : '25.4.+'
    userMessagingPlatformVersion = rootProject.hasProperty('userMessagingPlatformVersion') ? rootProject.ext.userMessagingPlatformVersion : '4.0.0'
    androidxCoreVersion = rootProject.hasProperty('androidxCoreVersion') ? rootProject.ext.androidxCoreVersion : '1.19.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "com.getcapacitor.community.admob.admob"
    compileSdk = rootProject.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 37
    defaultConfig {
        consumerProguardFiles "proguard-rules.pro"
        minSdk = rootProject.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 26
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    if (rootProject.hasProperty('nativeUIEngineRepository')) {
        maven { url = uri(rootProject.property('nativeUIEngineRepository')) }
    }
    google()
    mavenCentral()

}

def testRunner = "1.7.0"

dependencies {
    implementation "io.github.webview-native-ui:engine:${project.findProperty('nativeUIEngineVersion') ?: '[1.0.10,2.0.0)'}"
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')

    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.15.2'
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.11.4"
    // https://medium.com/google-developer-experts/pushing-the-limits-of-androidx-test-3776ff249c71
    testImplementation "androidx.test:core:$testRunner"
    testImplementation "androidx.test:runner:$testRunner"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.11.4"
    testImplementation "org.junit.jupiter:junit-jupiter-params:5.11.4"
    testRuntimeOnly "org.junit.vintage:junit-vintage-engine:5.11.4"
    testImplementation 'org.json:json:20231013'
    // We do not need expresso tests here... or?
    //    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    //    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"

    implementation "com.google.android.gms:play-services-ads:$playServicesAdsVersion"
    implementation "com.google.android.ump:user-messaging-platform:$userMessagingPlatformVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
}

// Allow to run unit test with  ./gradlew test
tasks.withType(Test) {
    useJUnitPlatform()
}
